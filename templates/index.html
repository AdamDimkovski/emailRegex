<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Head infomation, includes encoding type, metadata, title, css link and confettit loading-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsYourEmailAddressValid.Com</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>

<body>

    <!-- Header Chunk-->
    <header class="header">
        <h1>IsYourEmailAddressValid.COM</h1>
    </header>

    <!-- Page Wrapper Div: This holds the main input field and text, aswell as the gifs for success case -->
    <div class="page-wrapper">


    <!-- Main form container -->
     <div class="main-content">
        <form id="emailForm" class="email-form">
            <label for="email">Input Your Email Address 😡: </label>
            
            <!-- Changed type to email for built-in browser validation -->
            <input type="email" id="email" name="email" required placeholder="name@example.com">
            
            <input type="submit" value="Submit">
        </form>

        <div id="resultArea"></div>

        </div>

        </div>

    <script>
        // Call for email form answer case
        document.getElementById("emailForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const response = await fetch("/check-email", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            document.getElementById("resultArea").innerHTML = "";
            showResult(data.message, data.result_gif);
        });

        // function which hanldes case outputs
        function showResult(message, result_gif) {
            const area = document.getElementById("resultArea");

            // The success case cats block:
            if (result_gif === "success.gif") {
            area.innerHTML = `
                <img class="side-gif-success" src="/static/success.gif" alt="Result animation">
                <p>${message}</p>
                <img class="side-gif-success" src="/static/success.gif" alt="Result animation">
            `;
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            new Audio("/static/yipeee.mp3").play().catch(() => {});
            } 

            // the failure case block:
            if (result_gif === "failed.png") {
                area.innerHTML += `<div class="wasted-overlay" id="wastedOverlay"><img src="/static/${result_gif}" alt="Result animation"></div>`;
                setTimeout(() => document.getElementById("wastedOverlay")?.remove(), 4000);
                new Audio("/static/failed.mp3").play().catch(() => {});
            }

            // the hacker case block
            if (result_gif === "hacker.gif") {
                area.innerHTML += `
                    <div id="flashOverlay"></div>
                    <div class="progress-container"><div class="fake-progress-bar"></div></div>
                    <p id="threatText" style="color:#ff3333; font-family: monospace;">INITIALIZING TRACE...</p>
                    <div id="fullscreenGif" style="display:none;"><img id="explosionImg" alt="hacker detected"></div>
                `;
                startThreatSequence();

                setTimeout(function() {
                    const fullscreenGif = document.getElementById("fullscreenGif");
                    fullscreenGif.style.display = "flex";
                    document.getElementById("explosionImg").src = "/static/explosion.gif";
                    setTimeout(() => fullscreenGif.remove(), 6500);
                }, 4000);
            }
        }

        // List of messages during hacker sequence
        const messages = [
            "INITIALIZING TRACE...", "LOCATING SOURCE IP...", "BREACHING FIREWALL...",
            "IDENTITY CONFIRMED.", "NOTIFYING AUTHORITIES..."
        ];
        
        function playCue(audio) {
            audio.currentTime = 0;
            return audio.play();
        }

        function startThreatSequence() {
            let i = 0;
            const el = document.getElementById("threatText");
            const beep = new Audio("/static/beep.mp3");
            const boom = new Audio("/static/boom.mp3");

            const interval = setInterval(() => {
                i++;
                if (i < messages.length) {
                    el.textContent = messages[i];
                    playCue(beep).catch(() => {});
                } else {
                    clearInterval(interval);
                }
            }, 800);

            playCue(beep).catch(() => {});
            setTimeout(() => {
                clearInterval(interval);
                beep.pause();
                beep.currentTime = 0;
                playCue(boom).catch(() => {});
            }, 4000);
        }
    </script>

</body>

</html>
